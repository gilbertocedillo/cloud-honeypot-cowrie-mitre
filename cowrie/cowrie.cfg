# Cowrie custom configuration - merge into etc/cowrie.cfg on the honeypot
# Docs: https://docs.cowrie.org/en/latest/config/
# SAFETY: this is a FAKE shell. No real credentials, no real data, ever.

[honeypot]
# Plausible, boring hostname - do NOT name it "honeypot"
hostname = svr04
# Where Cowrie writes JSON logs (the shipper tails this file)
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
# Fake filesystem snapshot that attackers browse (cowrie ships fs.pickle;
# generate your own with: bin/createfs - see Cowrie docs). Never mirror
# a real production host's filesystem.
filesystem = share/cowrie/fs.pickle
etc_path = etc
contents_path = honeyfs
txtcmds_path = txtcmds

[ssh]
enabled = true
# Cowrie listens here; iptables redirects 22 -> 2222 (see user_data)
listen_endpoints = tcp:2222:interface=0.0.0.0
# Fake version banner - look like a slightly old, plausible Ubuntu sshd
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
# Auth: accept after a few random attempts so attackers enter the fake
# shell and reveal TTPs, instead of bouncing off a hard deny.
auth_class = AuthRandom
auth_class_parameters = 2, 5, 10

[telnet]
# Keep Telnet OFF unless you specifically study Telnet botnets ( Mirai-style ).
enabled = false

[output_jsonlog]
enabled = true
logfile = cowrie.json
epoch_timestamp = true

[output_textlog]
enabled = true
logfile = cowrie.log

# Downloads (wget/curl payloads = C2 / staging indicators) are saved and
# hashed by Cowrie into cowrie.json as cowrie.session.file_download.
# NEVER execute downloaded files. Analyze hashes on VirusTotal only.
